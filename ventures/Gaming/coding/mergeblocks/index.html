<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>星图能量网 - Merge Blocks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, #1a0b3a 0%, #0a0a1a 70%);
    }
    canvas { display: block; }
    
    /* 加载中状态 */
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a1a;
      color: #6a3eb8;
      font-family: 'Arial Black', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      transition: opacity 0.6s ease;
      z-index: 9999;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a1850;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>星图能量网</span>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // 当 PixiJS canvas 出现后隐藏 loading
    const observer = new MutationObserver(() => {
      const canvas = document.querySelector('canvas');
      if (canvas) {
        document.getElementById('loading').classList.add('hidden');
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('game-container'), { childList: true, subtree: true });
    // 超时保护
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      observer.disconnect();
    }, 5000);
  </script>
</body>
</html>
